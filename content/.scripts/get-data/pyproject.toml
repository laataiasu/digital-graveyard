[project]
name = "get-data"
version = "0.1.0"
description = "Automated media consumption ingestion for Digital Graveyard"
readme = "Data Collection for Content Consumption.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.7.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
]

[project.scripts]
get-data = "main:main"
